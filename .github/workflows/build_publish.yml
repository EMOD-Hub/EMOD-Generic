name: Build EMOD and publish to PyPI

on:
  workflow_dispatch:
    inputs:
      development:
        description: 'Publish as a development version (appends .devN to version)'
        required: false
        type: boolean
        default: false
      dev_number:
        description: 'Dev version number N (used when development is true, e.g. 1 for .dev1)'
        required: false
        type: string
        default: '0'

jobs:
  build:
    name: Build and create artifacts
    uses: ./.github/workflows/reusable_build_archive.yml
    with:
      disease_type: Generic
      science_test: ' '
      dev_version: ${{ inputs.development == true && inputs.dev_number || '' }}

  publish:
    name: Publish emod-generic to PyPI
    runs-on: ubuntu-latest
    needs:
      - build
    environment:
      name: pypi
      url: https://pypi.org/project/emod-generic
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
      - name: Validate dev version input
        if: ${{ inputs.development == true }}
        run: |
          if [ -z "${{ inputs.dev_number }}" ]; then
            echo "::error::Dev number is required when development is true"
            exit 1
          fi
          if ! echo "${{ inputs.dev_number }}" | grep -qE '^[0-9]+$'; then
            echo "::error::Dev number must be a non-negative integer, got '${{ inputs.dev_number }}'"
            exit 1
          fi
          echo "Will publish as development version with .dev${{ inputs.dev_number }} suffix"
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Prepare package directory
        run: |
          {
            echo "> **emod-generic** — This package is a disease-specific distribution of the EMOD binary for the **Generic** simulation type."
            echo ""
            cat README.md
          } > pypi/README.md
      - name: Download executable
        uses: actions/download-artifact@v8
        with:
          name: Eradication
          path: pypi_generic/src/eradication_dir
      - name: Download schema
        uses: actions/download-artifact@v8
        with:
          name: schema.json
          path: pypi_generic/src/schema_dir
      - name: Download version
        uses: actions/download-artifact@v8
        with:
          name: version
          path: pypi_generic/src/version_dir
      - name: Prep files
        run: |
          cd pypi_generic/src
          mv version_dir/version version
          zip -j emod_generic/Eradication.zip eradication_dir/Eradication
          zip -j emod_generic/schema.zip schema_dir/schema.json
          rm -r version_dir eradication_dir schema_dir
      - name: Build PyPI distribution
        run: |
          python3 -m pip install build
          cd pypi_generic
          python3 -m build
      - name: Upload files to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          packages-dir: pypi_generic/dist
