name: Build and publish to PyPI using Docker

on:
  workflow_dispatch:

jobs:
  build:
    name: Build executable
    runs-on: ubuntu-latest
    env:
      USER: GHA-Workflow
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check python and build executable in container
        uses: addnab/docker-run-action@v3
        with:
          username: anonymous
          registry: docker-production.packages.idmod.org:443
          image: idm/dtk-centos-buildenv:3.0
          run: |
            python3 --version
            python3 -m pip list
            scons --Release --jobs=4 --Disease=Generic --directory=EMOD-Generic/
      - name: Strip symbols and generate schema
        run: |
          cp EMOD-Generic/build/x64/Release/Eradication/Eradication Eradication
          strip Eradication
          ./Eradication --get-schema --schema-path schema.json
      - name: Archive executable
        uses: actions/upload-artifact@v4
        with:
          name: Eradication
          path: Eradication
      - name: Archive schema
        uses: actions/upload-artifact@v4
        with:
          name: schema.json
          path: schema.json

  publish:
    name: Publish distribution to PyPI
    runs-on: ubuntu-latest
    needs:
      - build
    environment:
      name: pypi
      url: https://pypi.org/project/emod-generic
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: Eradication
          path: Eradication
      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: schema.json
          path: schema.json
      - name: Create version file in src directory
        run : |
          grep DTK_Version schema.json | sed 's/[^0-9.]//g' > src/version
      - name: Create archives for src directory
        run: |
          zip src/emod_generic/Eradication.zip Eradication
          zip src/emod_generic/schema.zip schema.json
      - name: Build PyPI distribution
        run: |
          python3 -m pip install build
          python3 -m build
      - name: Validate
        run: |
          cat src/version
          ls src/emod_generic
      # - name: Upload files to PyPI
      #   uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     verbose: true
